{% extends 'base.html' %}

{% block extra_css %}
<style>
    .trainer-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
    }

    #staff-container {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        border: 2px solid var(--border);
        transition: border-color 0.3s;
    }

    .status-bar {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 600px;
        font-weight: 600;
        color: var(--text-secondary);
    }

    .notes-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1rem;
        max-width: 600px;
        width: 100%;
    }

    .notes-grid:last-child {
        grid-template-columns: repeat(3, 1fr);
        margin-top: -1rem;
    }
    
    .btn-note {
        padding: 1.5rem;
        font-size: 1.5rem;
        border-radius: 1rem;
        background: var(--surface);
        border: 2px solid var(--border);
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
        transition: all 0.1s;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .btn-note:hover {
        transform: translateY(-2px);
        border-color: var(--primary);
        box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.2);
    }

    .btn-note:active {
        transform: translateY(2px);
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .flash-correct {
        border-color: var(--success) !important;
        background-color: rgba(16, 185, 129, 0.1);
    }

    .flash-incorrect {
        border-color: var(--danger) !important;
        background-color: rgba(239, 68, 68, 0.1);
        animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    #feedback-msg {
        height: 1.5rem;
        font-weight: 600;
        text-align: center;
        width: 100%;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="trainer-container">
    <div style="text-align: center;">
        <h2 style="margin-bottom: 0.5rem;">{{ game.name }}</h2>
        <div id="feedback-msg"></div>
    </div>

    <div class="status-bar" style="align-items: center;">
        <div>🔥 Racha: <span id="streak-counter">{{ score.current_streak }}</span></div>
        <div style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem;">
            <input type="checkbox" id="autoplay-audio" style="cursor: pointer; width: 1.1rem; height: 1.1rem;">
            <label for="autoplay-audio" style="cursor: pointer; font-weight: 600; color: var(--text-secondary); user-select: none;">🔊 Auto-reproducir</label>
        </div>
        <div>Nivel: <span id="level-counter">{{ score.level }}</span></div>
    </div>

    <div style="position: relative;">
        <div id="staff-container">
            <!-- VexFlow will render here -->
        </div>
        <button id="btn-replay-note" class="btn" style="position: absolute; bottom: 12px; right: 12px; padding: 0; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 1.25rem; transition: all 0.2s;" title="Escuchar nota" onmouseover="this.style.borderColor='var(--primary)'; this.style.transform='scale(1.05)';" onmouseout="this.style.borderColor='var(--border)'; this.style.transform='scale(1)';">
            🔊
        </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 600px;">
        <div class="notes-grid">
            <button class="btn-note" data-note="c">Do</button>
            <button class="btn-note" data-note="d">Re</button>
            <button class="btn-note" data-note="e">Mi</button>
            <button class="btn-note" data-note="f">Fa</button>
        </div>
        <div class="notes-grid" style="grid-template-columns: repeat(3, 1fr);">
            <button class="btn-note" data-note="g">Sol</button>
            <button class="btn-note" data-note="a">La</button>
            <button class="btn-note" data-note="b">Si</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/vexflow@3.0.9/releases/vexflow-min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const VF = Vex.Flow;
        const div = document.getElementById("staff-container");
        const feedbackMsg = document.getElementById("feedback-msg");
        const autoPlayCheck = document.getElementById("autoplay-audio");
        const btnReplay = document.getElementById("btn-replay-note");
        let renderer, context, stave;
        
        const possibleNotes = ['c/4', 'd/4', 'e/4', 'f/4', 'g/4', 'a/4', 'b/4', 'c/5', 'd/5', 'e/5', 'f/5', 'g/5'];
        const noteNames = { 'c': 'Do', 'd': 'Re', 'e': 'Mi', 'f': 'Fa', 'g': 'Sol', 'a': 'La', 'b': 'Si' };
        
        let currentNoteStr = "";
        let currentNoteLetter = "";
        let startTime = 0;

        // Auto-play settings persistence
        if (localStorage.getItem("autoplay_notas") === "false") {
            autoPlayCheck.checked = false;
        } else {
            autoPlayCheck.checked = true; // default to true
        }

        autoPlayCheck.addEventListener("change", () => {
            localStorage.setItem("autoplay_notas", autoPlayCheck.checked);
        });

        btnReplay.addEventListener("click", () => {
            if (currentNoteStr) {
                AudioEngine.playNote(currentNoteStr);
            }
        });

        function initVexFlow() {
            div.innerHTML = "";
            renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
            renderer.resize(300, 150);
            context = renderer.getContext();
            context.setFont("Arial", 10, "").setBackgroundFillStyle("#eed");

            stave = new VF.Stave(10, 20, 280);
            stave.addClef("treble");
            stave.setContext(context).draw();
        }

        function drawNote() {
            initVexFlow();
            
            currentNoteStr = possibleNotes[Math.floor(Math.random() * possibleNotes.length)];
            currentNoteLetter = currentNoteStr.charAt(0);

            const note = new VF.StaveNote({ clef: "treble", keys: [currentNoteStr], duration: "q" });
            
            const voice = new VF.Voice({ num_beats: 1, beat_value: 4 });
            voice.addTickables([note]);

            const formatter = new VF.Formatter().joinVoices([voice]).format([voice], 200);
            voice.draw(context, stave);
            
            startTime = Date.now();
            feedbackMsg.innerText = "";

            if (autoPlayCheck.checked) {
                setTimeout(() => {
                    AudioEngine.playNote(currentNoteStr);
                }, 50);
            }
        }

        function handleGuess(guessedLetter) {
            const responseTime = Date.now() - startTime;
            const isCorrect = guessedLetter === currentNoteLetter;

            if (isCorrect) {
                div.classList.add("flash-correct");
                feedbackMsg.innerText = "¡Correcto!";
                feedbackMsg.style.color = "var(--success)";
            } else {
                div.classList.add("flash-incorrect");
                feedbackMsg.innerText = "Incorrecto. La respuesta era " + noteNames[currentNoteLetter] + ".";
                feedbackMsg.style.color = "var(--danger)";
            }

            setTimeout(() => {
                div.classList.remove("flash-correct");
                div.classList.remove("flash-incorrect");
            }, 500);

            fetch('{% url "record_attempt" game.slug %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    presented_question: currentNoteStr,
                    guessed_answer: guessedLetter,
                    is_correct: isCorrect,
                    response_time_ms: responseTime
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('streak-counter').innerText = data.current_streak;
                    document.getElementById('level-counter').innerText = data.level;
                }
            })
            .catch(err => console.error(err));

            setTimeout(drawNote, 800);
        }

        document.querySelectorAll('.btn-note').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (feedbackMsg.innerText !== "") return;
                const guessedLetter = e.target.getAttribute('data-note');
                handleGuess(guessedLetter);
            });
        });

        drawNote();
    });
</script>
{% endblock %}
