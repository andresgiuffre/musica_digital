{% extends 'base.html' %}

{% block extra_css %}
<style>
    .trainer-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
    }

    #playback-area {
        background: white;
        border-radius: 1rem;
        padding: 3rem;
        box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
        border: 2px solid var(--border);
        transition: border-color 0.3s;
        text-align: center;
        width: 100%;
        max-width: 600px;
    }

    .status-bar {
        display: flex;
        justify-content: space-between;
        width: 100%;
        max-width: 600px;
        font-weight: 600;
        color: var(--text-secondary);
        align-items: center;
    }

    .bpm-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--surface);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        border: 1px solid var(--border);
    }

    .bpm-control select {
        border: none;
        background: transparent;
        font-weight: bold;
        color: var(--primary);
        font-size: 1rem;
        cursor: pointer;
        outline: none;
    }

    #staff-container {
        display: flex;
        justify-content: center;
        margin-bottom: 2rem;
    }

    .play-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 1.5rem 3rem;
        font-size: 1.5rem;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
    }

    .play-btn:hover:not(:disabled) {
        transform: scale(1.05);
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.6);
    }

    .play-btn:disabled {
        background: var(--text-secondary);
        box-shadow: none;
        cursor: wait;
    }

    #feedback-msg {
        font-size: 1.5rem;
        font-weight: 800;
        height: 2rem;
    }

    #countdown {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--primary);
        height: 2rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="trainer-container">
    <div style="text-align: center; margin-bottom: 1rem;">
        <h1 style="margin-bottom: 0.5rem;">{{ game.name }}</h1>
        <p style="color: var(--text-secondary);">Sigue el pulso visual y canta el ritmo. (La altura no importa)</p>
    </div>

    <div class="status-bar">
        <div>Nivel: <span id="level-counter" style="color: var(--primary);">{{ score.level }}</span></div>
        <div class="bpm-control">
            ⏱️ 
            <select id="bpm-selector">
                <option value="60">60 BPM</option>
                <option value="80" selected>80 BPM</option>
                <option value="100">100 BPM</option>
                <option value="120">120 BPM</option>
            </select>
        </div>
        <div>Ejercicios Leídos: <span id="streak-counter" style="color: var(--gold);">{{ score.total_answers }}</span> 📖</div>
    </div>

    <div id="playback-area">
        <div id="countdown"></div>
        <div id="staff-container"></div>
        <button id="play-rhythm-btn" class="play-btn">▶ Iniciar Ejercicio</button>
    </div>

    <div id="feedback-msg"></div>

    <!-- PREPARACIÓN NIVEL 2: Módulo de Micrófono -->
    <!-- 
    <div id="mic-module" style="display:none;">
        <p>Analizador de micrófono para evaluar precisión de Onsets.</p>
        <button id="btn-request-mic">Permitir Micrófono</button>
    </div>
    -->

</div>

{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/vexflow@3.0.9/releases/vexflow-min.js"></script>
<script>
    const VF = Vex.Flow;
    const div = document.getElementById("staff-container");
    const playBtn = document.getElementById('play-rhythm-btn');
    const bpmSelector = document.getElementById('bpm-selector');
    const countdownEl = document.getElementById('countdown');
    const feedbackMsg = document.getElementById('feedback-msg');

    let renderer, context, stave;
    let clickSynth = null;
    let currentNotes = [];
    let currentVoice = null;
    let currentBeams = [];

    function initSynth() {
        if (!clickSynth) {
            clickSynth = new Tone.Synth({
                oscillator: { type: "square" },
                envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
        }
    }

    function initVexFlow() {
        div.innerHTML = "";
        renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
        renderer.resize(400, 150);
        context = renderer.getContext();
        context.setFont("Arial", 10, "").setBackgroundFillStyle(getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || "#eeeedd");

        stave = new VF.Stave(10, 20, 380);
        stave.addClef("percussion").addTimeSignature("4/4");
        stave.setContext(context).draw();
    }

    function generateMeasure() {
        let beats = 4;
        let measureUnits = [];
        while (beats > 0) {
            if (beats >= 2 && Math.random() < 0.3) {
                measureUnits.push({ type: 'h', beats: 2 });
                beats -= 2;
            } else {
                if (Math.random() < 0.4) {
                    measureUnits.push({ type: '88', beats: 1 });
                } else {
                    measureUnits.push({ type: 'q', beats: 1 });
                }
                beats -= 1;
            }
        }

        currentNotes = [];
        measureUnits.forEach(unit => {
            let pitch = "b/4"; 
            if (unit.type === 'h') {
                currentNotes.push(new VF.StaveNote({ clef: "percussion", keys: [pitch], duration: "h" }));
            } else if (unit.type === 'q') {
                currentNotes.push(new VF.StaveNote({ clef: "percussion", keys: [pitch], duration: "q" }));
            } else if (unit.type === '88') {
                let n1 = new VF.StaveNote({ clef: "percussion", keys: [pitch], duration: "8" });
                let n2 = new VF.StaveNote({ clef: "percussion", keys: [pitch], duration: "8" });
                currentNotes.push(n1, n2);
            }
        });

        currentVoice = new VF.Voice({ num_beats: 4, beat_value: 4 });
        currentVoice.addTickables(currentNotes);
        new VF.Formatter().joinVoices([currentVoice]).format([currentVoice], 300);
        
        currentBeams = VF.Beam.generateBeams(currentNotes);

        redrawStaff();
    }

    function redrawStaff() {
        context.clear();
        stave.draw();
        currentVoice.draw(context, stave);
        currentBeams.forEach(b => b.setContext(context).draw());
    }

    playBtn.addEventListener('click', async () => {
        playBtn.disabled = true;
        playBtn.textContent = '🔊 Leyendo...';
        feedbackMsg.textContent = '';
        
        if (window.Tone) await Tone.start();
        initSynth();
        generateMeasure();
        
        const bpm = parseInt(bpmSelector.value);
        Tone.Transport.bpm.value = bpm;
        Tone.Transport.cancel();
        
        // Mute logic
        const isMuted = AudioEngine && AudioEngine.isMuted;
        if(isMuted) clickSynth.volume.value = -Infinity;
        else clickSynth.volume.value = (AudioEngine.volume === -Infinity) ? -Infinity : 0;

        let events = [];
        let currentBeat = 0;
        currentNotes.forEach(note => {
            events.push({ time: currentBeat, note: note });
            let dur = note.getDuration();
            if (dur === 'h') currentBeat += 2;
            else if (dur === 'q') currentBeat += 1;
            else if (dur === '8') currentBeat += 0.5;
        });

        // Schedule metronome (4 count-in beats + 4 measure beats)
        const beatTimeSec = 60 / bpm;
        for (let i = 0; i < 8; i++) {
            Tone.Transport.schedule((time) => {
                if (!isMuted) {
                    // Clic agudo en el primer pulso del compás
                    if(i === 0 || i === 4) clickSynth.triggerAttackRelease("C6", "16n", time);
                    else clickSynth.triggerAttackRelease("G5", "16n", time);
                }

                Tone.Draw.schedule(() => {
                    if (i < 4) countdownEl.textContent = `Cuenta: ${i + 1}`;
                    else countdownEl.textContent = "¡Canta!";
                }, time);

            }, i * beatTimeSec);
        }

        // Schedule highlights
        events.forEach(evt => {
            let timeInBeats = evt.time + 4; // offset by 4 count-in beats
            Tone.Transport.schedule((time) => {
                Tone.Draw.schedule(() => {
                    // Reset all
                    currentNotes.forEach(n => {
                        n.setStyle({fillStyle: "black", strokeStyle: "black"});
                    });
                    // Highlight current
                    evt.note.setStyle({fillStyle: "var(--primary)", strokeStyle: "var(--primary)"});
                    redrawStaff();
                }, time);
            }, timeInBeats * beatTimeSec);
        });

        // Schedule end
        Tone.Transport.schedule((time) => {
            Tone.Draw.schedule(() => {
                Tone.Transport.stop();
                countdownEl.textContent = "";
                currentNotes.forEach(n => n.setStyle({fillStyle: "black", strokeStyle: "black"}));
                redrawStaff();
                playBtn.disabled = false;
                playBtn.textContent = '▶ Siguiente Ejercicio';
                finishExercise();
            }, time);
        }, 8 * beatTimeSec);

        Tone.Transport.start();
    });

    function finishExercise() {
        fetch('/api/record_attempt/solfeo-ritmico/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                presented_question: 'lectura',
                guessed_answer: 'completado',
                is_correct: true,
                response_time_ms: 0
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('streak-counter').innerText = data.total_answers; // We display total answers here
                document.getElementById('level-counter').innerText = data.level;
                feedbackMsg.style.color = "var(--success)";
                feedbackMsg.textContent = "¡Lectura completada! 🎉";
            }
        });
    }

    // Init empty staff
    document.addEventListener("DOMContentLoaded", () => {
        initVexFlow();
    });
</script>
{% endblock %}
