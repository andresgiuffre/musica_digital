{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Música Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Tonal.js para análisis armónico MIDI -->
    <script src="https://cdn.jsdelivr.net/npm/tonal/browser/tonal.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'js/teoria.js' %}?v=2"></script>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Moderna con Glassmorphism */
        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 5px #f97316, 0 0 10px #f97316, 0 0 20px #ea580c, 0 0 40px #ea580c;
            text-decoration: none;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .nav-menu {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-link {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-link:hover {
            color: white;
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding-left: 2rem;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* Estilos Legados para compatibilidad con las vistas de entrenamiento que no usan Tailwind aún */
        .container-legacy { max-width: 1200px; margin: 0 auto; padding: 2rem; width: 100%; }
        .card { background: var(--surface); border-radius: 1rem; padding: 2rem; border: 1px solid rgba(255,255,255,0.1); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 0.75rem 1.5rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; text-decoration: none; font-size: 1rem; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

        /* Explanation Modal */
        #theory-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }
        .theory-modal-content {
            background-color: var(--surface);
            margin: auto;
            padding: 2rem;
            border: 1px solid var(--border);
            border-radius: 1rem;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
            text-align: center;
            transform: translateY(20px);
            animation: slideUp 0.3s forwards;
        }
        @keyframes slideUp { to { transform: translateY(0); } }
        .theory-modal-close {
            position: absolute;
            right: 1.5rem;
            top: 1rem;
            color: var(--text-secondary);
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .theory-modal-close:hover { color: var(--text); }
        .learning-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255,255,255,0.05);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toggle-switch {
            position: relative; width: 40px; height: 20px; background-color: var(--border); border-radius: 20px; cursor: pointer; transition: background-color 0.3s;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background-color: white; border-radius: 50%; transition: transform 0.3s;
        }
        .toggle-switch.active { background-color: var(--primary); }
        .toggle-switch.active::after { transform: translateX(20px); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'dashboard' %}" class="nav-brand flex items-center gap-2">
                <img src="{% static 'img/logo.png' %}" alt="Logo Música Digital" class="h-12 w-auto" style="mix-blend-mode: screen;">
                MÚSICA DIGITAL
            </a>
            
            {% if user.is_authenticated %}
            <div class="nav-menu">
                <a href="{% url 'dashboard' %}" class="nav-link">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Inicio
                </a>
                <a href="{% url 'biblioteca_list' %}" class="nav-link">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                    Biblioteca
                </a>
                <a href="{% url 'proyectos_list' %}" class="nav-link !text-emerald-400 hover:!text-emerald-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    Mis Proyectos
                </a>
                <a href="{% url 'midi_trainer_hub' %}" class="nav-link !text-purple-400 hover:!text-purple-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                    Estudio MIDI
                </a>
                
                <div class="nav-user">
                    <div class="learning-toggle">
                        <span style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);" id="mode-label">Evaluación</span>
                        <div class="toggle-switch" id="global-mode-toggle"></div>
                    </div>
                    <a href="{% url 'perfil' %}" class="nav-link !text-blue-400 hover:!text-blue-300">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        Mi Perfil
                    </a>
                </div>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Theory Modal -->
    <div id="theory-modal">
        <div class="theory-modal-content">
            <span class="theory-modal-close" id="theory-modal-close">&times;</span>
            <h2 id="theory-modal-title" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; color: var(--primary);">Explicación Teórica</h2>
            <div id="theory-modal-body" style="color: var(--text); font-size: 1rem; line-height: 1.6;"></div>
            <button id="theory-modal-btn" class="btn btn-primary" style="margin-top: 1.5rem; width: 100%;">Continuar</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const toggle = document.getElementById("global-mode-toggle");
            const label = document.getElementById("mode-label");
            if(toggle) {
                const currentMode = localStorage.getItem("app_mode") || "eval";
                if(currentMode === "learning") {
                    toggle.classList.add("active");
                    label.innerText = "Aprendizaje";
                    label.style.color = "var(--primary)";
                }
                toggle.addEventListener("click", () => {
                    toggle.classList.toggle("active");
                    if(toggle.classList.contains("active")) {
                        localStorage.setItem("app_mode", "learning");
                        label.innerText = "Aprendizaje";
                        label.style.color = "var(--primary)";
                    } else {
                        localStorage.setItem("app_mode", "eval");
                        label.innerText = "Evaluación";
                        label.style.color = "var(--text-secondary)";
                    }
                });
            }

            const modal = document.getElementById("theory-modal");
            const btnClose = document.getElementById("theory-modal-close");
            const btnCont = document.getElementById("theory-modal-btn");
            if(btnClose && btnCont) {
                btnClose.onclick = () => { modal.style.display = "none"; if(window.onTheoryModalClose) window.onTheoryModalClose(); }
                btnCont.onclick = () => { modal.style.display = "none"; if(window.onTheoryModalClose) window.onTheoryModalClose(); }
            }
        });
        
        window.showTheoryModal = function(title, content, callback) {
            document.getElementById("theory-modal-title").innerText = title;
            document.getElementById("theory-modal-body").innerHTML = content;
            document.getElementById("theory-modal").style.display = "flex";
            window.onTheoryModalClose = callback;
        };
        window.getAppMode = function() {
            return localStorage.getItem("app_mode") || "eval";
        };
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
